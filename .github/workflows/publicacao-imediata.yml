name: Testar publicacao imediata no X
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publicar texto de teste na conta validada
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_POST_MODE: shareNow
          BUFFER_CONFIRM_PUBLISH: SIM
          BUFFER_POST_TEXT: "Teste de automacao 456"
        run: python3 buffer_draft_test.py
