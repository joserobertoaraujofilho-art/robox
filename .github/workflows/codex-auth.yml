name: Codex - autorizar conta (configuracao inicial)

on:
  workflow_dispatch:
    inputs:
      autorizar:
        description: 'Autorizar login oficial do Codex neste runner privado e armazenamento em Actions Secret'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Same lock as the generation workflow: never refresh the same account in parallel.
concurrency:
  group: robox-codex-managed-auth
  cancel-in-progress: false

jobs:
  autenticar:
    if: >-
      github.repository == 'joserobertoaraujofilho-art/robox' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == true &&
      inputs.autorizar == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_HOME: ${{ runner.temp }}/robox-codex-auth
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verificar repositorio privado e armazenamento autorizado
        env:
          CODEX_SECRET_WRITER: ${{ secrets.CODEX_SECRET_WRITER }}
        run: python3 codex/runner.py auth-init
      - name: Instalar cliente oficial com versao fixa
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-save --ignore-scripts --no-audit --no-fund @openai/codex@0.163.0
          echo "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Login oficial - abrir link e confirmar codigo temporario
        id: login
        run: timeout 12m codex login --device-auth
      - name: Guardar sessao com criptografia do GitHub CLI
        if: success() && steps.login.outcome == 'success'
        env:
          CODEX_SECRET_WRITER: ${{ secrets.CODEX_SECRET_WRITER }}
        run: python3 codex/runner.py auth-save
      - name: Remover sessao do runner temporario
        if: always()
        run: rm -rf -- "$CODEX_HOME"
